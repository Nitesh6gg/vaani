[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; Single test softphone endpoint (Zoiper/Linphone). Codec is ulaw on the SIP leg;
; Asterisk transcodes to/from slin16 for the externalMedia leg (see CLAUDE.md).
[1001]
type=endpoint
context=vaani
disallow=all
