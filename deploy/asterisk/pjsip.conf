[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; Single test softphone endpoint (Zoiper/Linphone/MicroSIP). Codec is ulaw on
; the SIP leg; Asterisk transcodes to/from slin16 for the externalMedia leg
; (see CLAUDE.md).
;
; direct_media/rtp_symmetric/force_rport/rewrite_contact: without these,
; Asterisk trusts the softphone's advertised SDP/Via address for where to send
; RTP back to, instead of the address its packets actually arrived from.
; Observed live: this endpoint's Asterisk->caller audio direction was
; completely silent (caller->Asterisk worked fine, confirmed by STT
; transcribing correctly) whenever the softphone was on a different host/VM
; than Asterisk -- a textbook one-way-audio NAT symptom, not an
; externalMedia/AudioSocket bug. Needed even for a same-host Windows<->VM test
; setup, not just real NAT.
[1001]
type=endpoint
context=vaani
disallow=all
allow=ulaw
auth=1001
aors=1001
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[1001]
type=auth
auth_type=userpass
username=1001
password=vaani1001

[1001]
type=aor
max_contacts=1
