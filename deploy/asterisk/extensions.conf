[vaani]
exten => 1001,1,NoOp(Vaani loop-back test)
 same => n,Stasis(vaani)
 same => n,Hangup()

; A manual dialplan extension for ad-hoc testing from a softphone, bypassing
; Vaani/Stasis entirely -- the fastest way to tell whether an audio problem is
; Asterisk<->softphone (SIP/RTP/NAT) or something Vaani-side. Playback proves
; Asterisk->caller audio works at all before Echo tests the full round trip;
; if you can't hear "hello world" here, look at pjsip.conf's NAT settings
; (rtp_symmetric/force_rport/rewrite_contact/direct_media) and Windows
; Firewall before suspecting anything in this repo's Go code. NOT used by
; cmd/endianness-check: ARI's bridge API only accepts channels under Stasis
; application control, and a channel running Echo() here isn't -- that tool
; uses two externalMedia channels (slin16 + ulaw) bridged together instead, so
; Asterisk itself provides the transcoding round-trip without needing this
; extension. See docs/AUDIO_PIPELINE.md.
[vaani-tools]
exten => 9001,1,Answer()
 same => n,Playback(hello-world)
 same => n,Echo()
 same => n,Hangup()

; Used only by cmd/loadgen for control-plane load testing: loadgen originates
; Local/2001@test with app=vaani set on the request itself. That routes the
; originated (calling) half directly into Stasis(vaani), bypassing this dialplan
; entirely for that half -- while Asterisk also dials the *other* half of the
; Local channel pair into this extension, which re-enters Stasis(vaani) too. So
; each loadgen origination drives TWO Manager-tracked calls, not one; loadgen's
; -n therefore stresses roughly 2x that many concurrent bridges. Hanging up either
; half cascades to the other, so teardown is still clean.
[test]
exten => 2001,1,Answer()
 same => n,Stasis(vaani)
 same => n,Hangup()
