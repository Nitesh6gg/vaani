[vaani]
exten => 1001,1,NoOp(Vaani loop-back test)
 same => n,Stasis(vaani)
 same => n,Hangup()

; Used only by cmd/endianness-check: a pure dialplan Echo() leg, bridged with a
; second externalMedia channel, so the endianness probe can run without a human on
; a softphone. See docs/AUDIO_PIPELINE.md.
[vaani-tools]
exten => 9001,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; Used only by cmd/loadgen for control-plane load testing: loadgen originates
; Local/2001@test with app=vaani set on the request itself. That routes the
; originated (calling) half directly into Stasis(vaani), bypassing this dialplan
; entirely for that half -- while Asterisk also dials the *other* half of the
; Local channel pair into this extension, which re-enters Stasis(vaani) too. So
; each loadgen origination drives TWO Manager-tracked calls, not one; loadgen's
; -n therefore stresses roughly 2x that many concurrent bridges. Hanging up either
; half cascades to the other, so teardown is still clean.
[test]
exten => 2001,1,Answer()
 same => n,Stasis(vaani)
 same => n,Hangup()
