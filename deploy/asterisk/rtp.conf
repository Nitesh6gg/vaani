[general]
; Asterisk's own SIP-leg RTP range. Must not overlap the Go service's
; MEDIA_PORT_BASE/MEDIA_PORT_COUNT (20000-20255 by default).
rtpstart=10000
rtpend=19999

; Hang up a channel if no RTP/RTCP activity arrives for this many seconds
; (channel not on hold). Without this, a caller whose RTP just stops --
; network drop, crashed softphone, or (observed in a SIPp load test) the test
; tool itself being killed mid-call -- with no SIP BYE ever sent leaves the
; channel, its bridge, and its externalMedia leg to Vaani sitting there
; indefinitely: Asterisk never fires StasisEnd, so Vaani's teardown never
; runs, and internal/media's watchdog warns "no inbound audio" every 5s
; forever instead of the call ever actually ending. This is the layer that
; has to catch it -- Vaani only sees its own externalMedia leg, which stays
; legitimately "connected" the whole time; it has no visibility into whether
; the original caller is still there without Asterisk telling it via
; StasisEnd.
rtptimeout=60
; Same idea while a channel is on hold (longer, since real hold periods can be
; legitimately silent for a while). Vaani doesn't currently put channels on
; hold, so this mostly guards against a future feature or an unexpected
; Asterisk-side hold.
rtpholdtimeout=300
